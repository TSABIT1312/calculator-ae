    const STORAGE_KEY = 'myrep_purwokerto_leads';

    function getLocalLeads() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveLocalLead(lead) {
      try {
        const list = getLocalLeads();
        list.unshift({ ...lead, id: Date.now().toString(), timestamp: new Date().toISOString() });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {
        console.error(e);
      }
    }

    async function searchScId(id) {
      const clean = id.toString().trim().toLowerCase();
      if (window.google && window.google.script) {
        return new Promise((resolve) => {
          window.google.script.run
            .withSuccessHandler(res => resolve(res))
            .withFailureHandler(err => resolve({ success: false, message: err.toString() }))
            .searchIdSc(clean);
        });
      }

      const match = EXCEL_DATABASE.aeDatabase.find(x => x.id.toString().trim().toLowerCase() === clean);
      if (match) {
        return { success: true, data: { id: match.id, ae: match.ae, asm: match.asm } };
      }
      if (clean === "123") {
        return { success: true, data: { id: "123", ae: "Fani", asm: "Bima" } };
      }
      return { success: false, message: "ID SC UMP '" + id + "' tidak ditemukan di database." };
    }

    async function submitLead(payload) {
      saveLocalLead(payload);
      if (window.google && window.google.script) {
        return new Promise((resolve) => {
          window.google.script.run
            .withSuccessHandler(res => resolve(res))
            .withFailureHandler(err => resolve({ success: false, message: err.toString() }))
            .submitKunjunganData(payload);
        });
      }
      await new Promise(r => setTimeout(r, 400));
      return { success: true, message: "Data tersimpan ke area " + payload.area + "!" };
    }

    function getAeLeadStats(aeName) {
      const clean = (aeName || '').toLowerCase().trim();
      const leads = getLocalLeads();
      const counts = { total: 0, cool: 0, warm: 0, hot: 0, closing: 0 };
      leads.forEach(l => {
        if ((l.ae || '').toLowerCase().trim() === clean) {
          counts.total++;
          const st = (l.statusLead || '').toUpperCase();
          if (st === 'COOL') counts.cool++;
          else if (st === 'WARM') counts.warm++;
          else if (st === 'HOT') counts.hot++;
          else if (st === 'CLOSING') counts.closing++;
        }
      });
      return counts;
    }

    function getAllAsmNames() {
      const set = new Set();
      EXCEL_DATABASE.aeDatabase.forEach(item => {
        if (item.asm && item.asm.toLowerCase() !== 'asm / bm' && item.asm.toLowerCase() !== 'asm') {
          set.add(item.asm);
        }
      });
      return Array.from(set).sort();
    }

    function getAsmTeamData(asmName) {
      const clean = (asmName || '').toLowerCase().trim();
      const aeMap = new Map();
      EXCEL_DATABASE.aeDatabase.forEach(item => {
        if ((item.asm || '').toLowerCase().trim() === clean) {
          const ae = item.ae;
          if (ae && !aeMap.has(ae)) {
            const stats = getAeLeadStats(ae);
            aeMap.set(ae, {
              name: ae,
              id: item.id,
              ...stats
            });
          }
        }
      });
      return Array.from(aeMap.values()).sort((a, b) => b.total - a.total);
    }

    function KalkulatorView() {
      const [namaAe, setNamaAe] = useState('');
      const [idSc, setIdSc] = useState('');
      const [tanggal, setTanggal] = useState(() => new Date().toISOString().split('T')[0]);

      const [activeModule, setActiveModule] = useState('new_sa');
      const [selectedProductIndex, setSelectedProductIndex] = useState('');
      const [addedProducts, setAddedProducts] = useState([]);

      // 3 Bulan
      const [kategoriSales, setKategoriSales] = useState('junior');
      const [qtyBln1, setQtyBln1] = useState('');
      const [qtyBln2, setQtyBln2] = useState('');
      const [qtyBln3, setQtyBln3] = useState('');
      const [potonganBln1, setPotonganBln1] = useState('');
      const [potonganBln2, setPotonganBln2] = useState('');

      // BAT
      const [bulanMasuk, setBulanMasuk] = useState('1');

      const handleAddProduct = () => {
        if (selectedProductIndex === '') return;
        const idx = parseInt(selectedProductIndex, 10);
        if (!addedProducts.find(p => p.index === idx)) {
          setAddedProducts(prev => [...prev, { index: idx, name: PRODUCTS_DATA[idx].name, qty: 1 }]);
        }
        setSelectedProductIndex('');
      };

      const handleQtyChange = (index, val) => {
        const num = Math.max(0, parseInt(val, 10) || 0);
        setAddedProducts(prev => prev.map(p => p.index === index ? { ...p, qty: num } : p));
      };

      const handleRemoveProduct = (index) => {
        setAddedProducts(prev => prev.filter(p => p.index !== index));
      };

      const handleReset = () => {
        setAddedProducts([]);
        setSelectedProductIndex('');
        setQtyBln1('');
        setQtyBln2('');
        setQtyBln3('');
        setPotonganBln1('');
        setPotonganBln2('');
        setBulanMasuk('1');
      };

      const handleModuleChange = (e) => {
        setActiveModule(e.target.value);
        handleReset();
      };

      const totalQty = useMemo(() => {
        return addedProducts.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
      }, [addedProducts]);

      const moduleName = useMemo(() => {
        switch (activeModule) {
          case 'new_sa': return 'Insentif New SA';
          case 'prestasi_bln': return 'Uang Prestasi Bulanan';
          case 'prestasi_3bln': return 'Uang Prestasi 3 Bulanan';
          case 'bat': return 'Bonus Akhir Tahun (BAT)';
          default: return 'Kalkulator Insentif';
        }
      }, [activeModule]);

      const calculation = useMemo(() => {
        const rows = [];
        let gross = 0;
        let paid = 0;
        let tierLabel = '-';
        let paidLabel = 'Paid (80%)';
        let notice = null;

        if (activeModule === 'new_sa') {
          paidLabel = 'Paid (80%)';
          const tier = totalQty >= 15 ? '15+' : totalQty >= 11 ? '11-14' : totalQty >= 6 ? '6-10' : '0-5';
          tierLabel = tier;

          addedProducts.forEach(item => {
            if (item.qty > 0) {
              const prod = PRODUCTS_DATA[item.index];
              const tariff = prod.tariffs[tier];
              const sub = item.qty * tariff;
              gross += sub;
              rows.push({ name: prod.name, qty: item.qty, tariff, subtotal: sub });
            }
          });
          paid = gross * 0.8;
        } else if (activeModule === 'prestasi_bln') {
          paidLabel = 'Paid (50%)';
          const activeTier = PRESTASI_TIERS.find(t => totalQty >= t.min) || PRESTASI_TIERS[PRESTASI_TIERS.length - 1];
          tierLabel = activeTier.label;

          if (totalQty >= 10) {
            addedProducts.forEach(item => {
              if (item.qty > 0) {
                const prod = PRODUCTS_DATA[item.index];
                const tariff = activeTier.rates[prod.catPrestasi] || 0;
                const sub = item.qty * tariff;
                gross += sub;
                rows.push({ name: prod.name, qty: item.qty, tariff, subtotal: sub });
              }
            });
          } else if (addedProducts.length > 0) {
            notice = { type: 'warning', message: 'Minimal pencapaian 10 SA untuk mendapatkan Uang Prestasi.' };
          }

          paid = gross * 0.5;
          if (paid > activeTier.maxCap && activeTier.maxCap > 0) {
            paid = activeTier.maxCap;
            notice = {
              type: 'capped',
              message: "Pemberitahuan Limit: Estimasi pencairan 50% mencapai " + formatRupiah(gross * 0.5) + ". Batas maksimal tier ini adalah " + formatRupiah(activeTier.maxCap) + "."
            };
          }
        } else if (activeModule === 'prestasi_3bln') {
          paidLabel = 'Final Payout';
          const minTarget = kategoriSales === 'senior' ? 12 : 9;
          const q1 = parseInt(qtyBln1, 10) || 0;
          const q2 = parseInt(qtyBln2, 10) || 0;
          const q3 = parseInt(qtyBln3, 10) || 0;
          const pot1 = parseInt(potonganBln1, 10) || 0;
          const pot2 = parseInt(potonganBln2, 10) || 0;

          const isQualified = q1 >= minTarget && q2 >= minTarget && q3 >= minTarget;
          if (!isQualified && (q1 > 0 || q2 > 0 || q3 > 0 || addedProducts.length > 0)) {
            tierLabel = 'HANGUS';
            let reason = "Pencapaian bulanan Anda (" + q1 + ", " + q2 + ", " + q3 + ") tidak memenuhi syarat minimum " + kategoriSales.toUpperCase() + " (" + minTarget + " SA/bulan).";
            if (q1 === 0 && q2 === 0 && q3 === 0) reason = 'Mohon lengkapi data penjualan per bulan di form di atas.';
            notice = { type: 'danger', title: 'TIDAK KUALIFIKASI', message: reason };
            return { totalQty, tierLabel, gross: 0, paid: 0, rows: [], notice, paidLabel };
          }

          const activeTier = PRESTASI_3BLN_TIERS.find(t => totalQty >= t.min) || PRESTASI_3BLN_TIERS[PRESTASI_3BLN_TIERS.length - 1];
          tierLabel = activeTier.label;

          if (totalQty >= 30) {
            addedProducts.forEach(item => {
              if (item.qty > 0) {
                const prod = PRODUCTS_DATA[item.index];
                const tariff = activeTier.rates[prod.catPrestasi] || 0;
                const sub = item.qty * tariff;
                gross += sub;
                rows.push({ name: prod.name, qty: item.qty, tariff, subtotal: sub });
              }
            });
          } else if (addedProducts.length > 0) {
            notice = { type: 'warning', message: 'Lolos syarat bulanan, namun Total Akumulasi 3 Bulan belum mencapai 30 SA.' };
          }

          let finalGross = gross;
          if (gross > activeTier.maxCap && activeTier.maxCap > 0) {
            finalGross = activeTier.maxCap;
            notice = {
              type: 'capped',
              message: "Pemberitahuan Limit: Gross Anda mencapai " + formatRupiah(gross) + ". Batas maksimal tier " + activeTier.label + " adalah " + formatRupiah(activeTier.maxCap) + "."
            };
          }

          const totalPotongan = pot1 + pot2;
          paid = Math.max(0, finalGross - totalPotongan);
          return { totalQty, tierLabel, gross, paid, rows, notice, totalPotongan, paidLabel };
        } else if (activeModule === 'bat') {
          paidLabel = 'BAT Payout';
          const targetBulan = BAT_DATA[bulanMasuk] || BAT_DATA['1'];

          if (totalQty < targetBulan.min && addedProducts.length > 0) {
            tierLabel = 'HANGUS';
            notice = {
              type: 'danger',
              title: 'TIDAK KUALIFIKASI',
              message: "Total Akumulasi Anda (" + totalQty + " SA) belum memenuhi batas minimal " + targetBulan.min + " SA untuk bulan masuk " + targetBulan.label + "."
            };

              gross += sub;
              rows.push({ name: prod.name, qty: item.qty, tariff, subtotal: sub });
            }
          });

          paid = Math.min(gross, targetBulan.maxCap);
          if (gross > targetBulan.maxCap) {
            notice = {
              type: 'capped',
              message: "Pemberitahuan Limit: Total Kalkulasi BAT Anda mencapai " + formatRupiah(gross) + ". Namun batas maksimal pencairan adalah " + formatRupiah(targetBulan.maxCap) + "."
            };
          }
        }

        return {
          totalQty,
          tierLabel: addedProducts.length === 0 ? '-' : tierLabel,
          gross,
          paid,
          rows,
          notice,
          paidLabel
        };
      }, [activeModule, totalQty, addedProducts, kategoriSales, qtyBln1, qtyBln2, qtyBln3, potonganBln1, potonganBln2, bulanMasuk]);

                  className="sm:col-span-2 group bg-white border border-slate-200 hover:border-[#6f2c91] rounded-2xl p-5 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col sm:flex-row items-center justify-between text-center sm:text-left gap-4"
                >
                  <div className="flex flex-col sm:flex-row items-center gap-4">
                    <div className="p-3.5 bg-purple-50 text-[#6f2c91] rounded-2xl group-hover:bg-[#6f2c91] group-hover:text-white transition-all duration-300 shrink-0 ring-1 ring-purple-100">
                      <Icons.BarChart className="w-7 h-7" />
                    </div>
                    <div>
                      <h3 className="font-extrabold text-slate-800 text-base uppercase tracking-wider group-hover:text-[#6f2c91] transition-colors">Cek Jumlah Data Lead</h3>
                      <p className="text-slate-500 text-xs mt-0.5 leading-relaxed">Pantau total input data kunjungan per sales AE atau rekapitulasi tim ASM bulan berjalan</p>

                  </div>
                  <div className="hidden sm:flex items-center gap-1.5 px-4 py-2 bg-purple-50 group-hover:bg-[#6f2c91] text-[#6f2c91] group-hover:text-white font-bold text-xs rounded-xl transition-all">
                    Buka Rekap <Icons.ArrowRight className="w-4 h-4" />

          {step === 'strategy' && (
            <section className="space-y-6 max-w-4xl mx-auto">

              >
                <Icons.ArrowLeft className="w-4 h-4" /> Kembali ke Pilih Area
              </button>
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div className="bg-[#6f2c91] text-white p-5 flex justify-between items-center">
                  <div>
                    <span className="text-[10px] text-purple-200 font-bold uppercase tracking-wider">Strategi & Target Kerja Harian</span>
                    <h3 className="text-xl font-black tracking-tight">{selectedArea}</h3>

                  <div className="p-2.5 bg-white/10 rounded-xl backdrop-blur-sm">
                    <Icons.Target className="w-5 h-5 text-white" />

          {step === 'form' && (
            <StepForm

          {step === 'cek-lead' && (

    function StepForm({ areaName, onBack, onSuccess, showToast, setLoader }) {
      const [scIdInput, setScIdInput] = useState('');
      const [asm, setAsm] = useState('');
      const [ae, setAe] = useState('');
      const [clusterSearch, setClusterSearch] = useState('');
      const [selectedCluster, setSelectedCluster] = useState('');
      const [isClusterOpen, setIsClusterOpen] = useState(false);
      const [namaCapel, setNamaCapel] = useState('');
      const [noHp, setNoHp] = useState('');
      const [hpError, setHpError] = useState('');
      const [alamat, setAlamat] = useState('');
      const [isp, setIsp] = useState('');
      const [paket, setPaket] = useState('');
      const [statusLead, setStatusLead] = useState('');

      const areaClusters = EXCEL_DATABASE.clusters[areaName] || [];
      const filteredClusters = useMemo(() => {
        if (!clusterSearch.trim()) return areaClusters.slice(0, 100);
        const q = clusterSearch.toLowerCase().trim();
        return areaClusters.filter(c => c.toLowerCase().includes(q)).slice(0, 100);
      }, [areaClusters, clusterSearch]);

      const handleSearchSc = async () => {
        if (!scIdInput.trim()) {
          showToast('Peringatan', 'Masukkan ID SC UMP terlebih dahulu', 'warning');
          return;
        }
        setLoader({ show: true, title: 'Mencari Data', subtitle: 'Mencocokkan ID dengan database...' });
        const res = await searchScId(scIdInput.trim());
        setLoader({ show: false });
        if (res.success && res.data) {
          setAsm(res.data.asm || '');
          setAe(res.data.ae || '');
          showToast('Ditemukan', "AE: " + res.data.ae + " | ASM: " + res.data.asm, 'success');
        } else {
          setAsm('');
          setAe('');
          showToast('Tidak Ditemukan', res.message || 'ID tidak valid', 'error');
        }
      };

      const handleNoHpChange = (e) => {
        const raw = e.target.value.replace(/[^0-9]/g, '');
        setNoHp(raw);
        if (raw.length > 0) {
          const isValid = (raw.startsWith('08') || raw.startsWith('628')) && raw.length >= 10 && raw.length <= 14;
          setHpError(isValid ? '' : 'Nomor harus diawali 08 atau 628 dengan panjang 10-14 digit angka.');
        } else {
          setHpError('');
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!asm || !ae) {
          showToast('Validasi Gagal', 'Harap temukan ID SC UMP terlebih dahulu!', 'warning');
          return;
        }
        if (!selectedCluster) {
          showToast('Validasi Gagal', 'Pilih nama cluster dari daftar!', 'warning');
          return;
        }
        if (hpError || noHp.length < 10) {
          showToast('Validasi Gagal', 'Nomor HP tidak valid!', 'warning');
          return;
        }

        const payload = {
          area: areaName,
          asm,
          ae,
          namaCapel: namaCapel.trim(),
          noHp: noHp.trim(),
          alamatCapel: alamat.trim(),
          ispSekarang: isp.trim(),
          paketDiminati: paket,
          statusLead,
          cluster: selectedCluster
        };

        setLoader({ show: true, title: 'Menyimpan', subtitle: 'Menyimpan data lead kunjungan...' });
        const res = await submitLead(payload);
        setLoader({ show: false });
        if (res.success) {
          showToast('Berhasil Disimpan!', "Laporan kunjungan untuk " + namaCapel + " tersimpan!", 'success');
          onSuccess();
        } else {
          showToast('Gagal', res.message, 'error');
        }
      };

      return (
        <section className="space-y-6 max-w-4xl mx-auto">
          <button
            type="button"
            onClick={onBack}
            className="inline-flex items-center gap-1.5 text-xs font-bold text-[#6f2c91] hover:text-[#582173] transition"
          >
            <Icons.ArrowLeft className="w-4 h-4" /> Kembali ke Strategi
          </button>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="bg-[#6f2c91] p-5 text-white flex justify-between items-center">
              <div>
                <h3 className="font-extrabold text-lg">Form Kunjungan Prospek</h3>
                <p className="text-[11px] text-purple-200">Silakan isi data calon pelanggan dengan akurat</p>
              </div>
              <span className="px-3 py-1 bg-white/20 backdrop-blur-sm rounded-full text-xs font-black tracking-wider border border-white/30">
                {areaName}
              </span>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-5">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">Cari ID SC UMP <span className="text-rose-500">*</span></label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    required
                    value={scIdInput}
                    onChange={(e) => setScIdInput(e.target.value)}
                    placeholder="Masukkan ID SC UMP..."
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-[#6f2c91] transition"
                  />
                  <button
                    type="button"
                    onClick={handleSearchSc}
                    className="bg-[#6f2c91] hover:bg-[#582173] text-white font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-2 shrink-0 transition"
                  >
                    <Icons.Search className="w-4 h-4" /> Cari
                  </button>
                </div>
                <p className="text-[11px] text-slate-400 mt-1">Contoh ID SC Purwokerto: 6182994, 6213766, atau 123.</p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Nama ASM</label>
                  <input
                    type="text"
                    readOnly
                    value={asm}
                    placeholder="Otomatis terisi..."
                    className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 font-bold cursor-not-allowed"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Nama AE</label>
                  <input
                    type="text"
                    readOnly
                    value={ae}
                    placeholder="Otomatis terisi..."
                    className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 font-bold cursor-not-allowed"
                  />
                </div>
              </div>

              <div className="relative">
                <label className="block text-xs font-bold text-slate-700 mb-1.5">Nama Cluster <span className="text-rose-500">*</span></label>
                <div className="relative">
                  <input
                    type="text"
                    required
                    value={clusterSearch}
                    onChange={(e) => { setClusterSearch(e.target.value); setIsClusterOpen(true); }}
                    onFocus={() => setIsClusterOpen(true)}
                    placeholder="Ketik untuk cari Cluster kampus / perumahan..."
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-3 pr-10 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-[#6f2c91] transition"
                  />
                  <div
                    className="absolute right-3 top-3 text-slate-400 cursor-pointer"
                    onClick={() => setIsClusterOpen(p => !p)}
                  >
                    <Icons.ChevronDown className="w-4 h-4" />
                  </div>
                </div>

                {selectedCluster && (
                  <p className="text-[11px] text-[#6f2c91] font-bold mt-1 flex items-center gap-1">
                    <Icons.Check className="w-3.5 h-3.5" /> Terpilih: {selectedCluster}
                  </p>
                )}

                {isClusterOpen && (
                  <div className="absolute left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-xl shadow-xl max-h-56 overflow-y-auto z-50 divide-y divide-slate-50 custom-scrollbar">
                    <div className="p-2 sticky top-0 bg-purple-50 text-[11px] font-bold text-[#6f2c91]">
                      DAFTAR {areaClusters.length} CLUSTER ({areaName})
                    </div>
                    {filteredClusters.map((c, i) => (
                      <button
                        key={i}
                        type="button"
                        onClick={() => { setSelectedCluster(c); setClusterSearch(c); setIsClusterOpen(false); }}
                        className="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-purple-50 hover:text-[#6f2c91] block"
                      >
                        {c}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <hr className="border-slate-100" />

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Nama Calon Pelanggan <span className="text-rose-500">*</span></label>
                  <input
                    type="text"
                    required
                    value={namaCapel}
                    onChange={(e) => setNamaCapel(e.target.value)}
                    placeholder="Nama lengkap calon pelanggan"
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-[#6f2c91] transition"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Nomor WhatsApp / HP Capel <span className="text-rose-500">*</span></label>
                  <input
                    type="tel"
                    required
                    value={noHp}
                    onChange={handleNoHpChange}
                    maxLength={14}
                    placeholder="Contoh: 081234567890"
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-[#6f2c91] transition"
                  />
                  {hpError && <p className="text-[11px] text-rose-500 mt-1">{hpError}</p>}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">Alamat Lengkap Capel <span className="text-rose-500">*</span></label>
                <textarea
                  rows="3"
                  required
                  value={alamat}
                  onChange={(e) => setAlamat(e.target.value)}
                  placeholder="Alamat lengkap beserta patokan rumah atau blok..."
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-[#6f2c91] transition"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">ISP Saat Ini <span className="text-rose-500">*</span></label>
                  <input
                    type="text"
                    required
                    value={isp}
                    onChange={(e) => setIsp(e.target.value)}
                    placeholder="Contoh: Indihome, Biznet, Belum Berlangganan"
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-[#6f2c91] transition"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Pilih Paket Diminati <span className="text-rose-500">*</span></label>
                  <select
                    required
                    value={paket}
                    onChange={(e) => setPaket(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-[#6f2c91] transition font-medium"
                  >
                    <option value="" disabled>-- Pilih Paket Layanan --</option>
                    {PRODUCTS_DATA.map((p, i) => (
                      <option key={i} value={p.name}>{p.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">Status Lead / Follow-Up <span className="text-rose-500">*</span></label>
                <select
                  required
                  value={statusLead}
                  onChange={(e) => setStatusLead(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-[#6f2c91] transition font-bold"
                >
                  <option value="" disabled>-- Pilih Status Lead --</option>
                  {LEAD_STATUS_OPTIONS.map((opt) => (
                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                  ))}
                </select>
              </div>

              <div className="pt-4 flex flex-col sm:flex-row gap-3">
                <button
                  type="submit"
                  className="flex-1 py-3.5 bg-[#6f2c91] hover:bg-[#582173] text-white font-bold rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2"
                >
                  <Icons.Save className="w-4 h-4" /> Simpan Laporan Kunjungan
                </button>
                <button
                  type="button"
                  onClick={onBack}
                  className="py-3.5 px-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition flex items-center justify-center gap-2"
                >
                  <Icons.X className="w-4 h-4" /> Batalkan
                </button>
              </div>
            </form>
          </div>
        </section>
      );
    }

    function StepCekLead({ onBack, showToast, setLoader }) {
      const [activeTab, setActiveTab] = useState('ae');
      const [searchScIdVal, setSearchScIdVal] = useState('');
      const [aeInfo, setAeInfo] = useState(null);
      const [aeStats, setAeStats] = useState(null);

      const [selectedAsm, setSelectedAsm] = useState('');
      const [teamData, setTeamData] = useState([]);

      const asmList = useMemo(() => getAllAsmNames(), []);

      const handleSearchAe = async () => {
        if (!searchScIdVal.trim()) {
          showToast('Peringatan', 'Ketik ID SC UMP terlebih dahulu', 'warning');
          return;
        }
        setLoader({ show: true, title: 'Mencari Data', subtitle: 'Mencari data AE...' });
        const res = await searchScId(searchScIdVal.trim());
        if (res.success && res.data) {
          setAeInfo(res.data);
          const stats = getAeLeadStats(res.data.ae);
          setAeStats(stats);
          setLoader({ show: false });
          showToast('Ditemukan', "AE: " + res.data.ae, 'success');
        } else {
          setAeInfo(null);
          setAeStats(null);
          setLoader({ show: false });
          showToast('Tidak Ditemukan', res.message || 'ID SC tidak ditemukan', 'error');
        }
      };

      const handleAsmSelect = (name) => {
        setSelectedAsm(name);
        const data = getAsmTeamData(name);
        setTeamData(data);
      };

      const teamTotals = useMemo(() => {
        return teamData.reduce((acc, x) => ({
          total: acc.total + x.total,
          cool: acc.cool + x.cool,
          warm: acc.warm + x.warm,
          hot: acc.hot + x.hot,
          closing: acc.closing + x.closing
        }), { total: 0, cool: 0, warm: 0, hot: 0, closing: 0 });
      }, [teamData]);

      const aeTabClass = activeTab === 'ae'
        ? 'flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all bg-white text-[#6f2c91] shadow-sm'
        : 'flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all text-slate-500 hover:text-slate-700';

      const timTabClass = activeTab === 'tim'
        ? 'flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all bg-white text-[#6f2c91] shadow-sm'
        : 'flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all text-slate-500 hover:text-slate-700';

      return (
        <section className="space-y-6 max-w-3xl mx-auto">
          <button
            type="button"
            onClick={onBack}
            className="inline-flex items-center gap-1.5 text-xs font-bold text-[#6f2c91] hover:text-[#582173] transition"
          >
            <Icons.ArrowLeft className="w-4 h-4" /> Kembali ke Menu Utama
          </button>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden p-5 sm:p-6 space-y-5">
            <div className="text-center mb-6">
              <h3 className="font-extrabold text-xl text-slate-800">Cek Jumlah Data Lead Sales</h3>
              <p className="text-xs text-slate-500 mt-1">Cari berdasarkan ID SC UMP atau pilih nama ASM untuk melihat rekapitulasi tim</p>
            </div>

            <div className="flex p-1 bg-slate-100 rounded-xl mb-4">
              <button
                type="button"
                onClick={() => setActiveTab('ae')}
                className={aeTabClass}
              >
                Pencarian Individual (ID SC)
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('tim')}
                className={timTabClass}
              >
                Rekap Tim ASM
              </button>
            </div>

            {activeTab === 'ae' && (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Masukkan ID SC UMP</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={searchScIdVal}
                      onChange={(e) => setSearchScIdVal(e.target.value)}
                      placeholder="Ketik ID SC UMP..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-[#6f2c91] transition"
                    />
                    <button
                      type="button"
                      onClick={handleSearchAe}
                      className="bg-[#6f2c91] hover:bg-[#582173] text-white font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-2 shrink-0 transition"
                    >
                      <Icons.Search className="w-4 h-4" /> Cari
                    </button>
                  </div>
                </div>

                {aeInfo && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1.5">Nama ASM</label>
                      <input type="text" readOnly value={aeInfo.asm} className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 font-bold cursor-not-allowed" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1.5">Nama AE</label>
                      <input type="text" readOnly value={aeInfo.ae} className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 font-bold cursor-not-allowed" />

                        <div className="p-3 bg-[#6f2c91] text-white rounded-xl shadow-sm">
                          <Icons.Database className="w-6 h-6" />

                        <p className="text-lg font-black text-amber-800 mt-0.5">{aeStats.warm}</p>
                      </div>
                      <div className="bg-orange-50 border border-orange-200 rounded-xl p-3 text-center">
                        <p className="text-[10px] font-bold text-orange-700 uppercase tracking-wider">Hot</p>
                        <p className="text-lg font-black text-orange-800 mt-0.5">{aeStats.hot}</p>
                      </div>
                      <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center">
                        <p className="text-[10px] font-bold text-emerald-700 uppercase tracking-wider">Closing</p>
                        <p className="text-lg font-black text-emerald-800 mt-0.5">{aeStats.closing}</p>
                      </div>
                    </div>

                    {aeInfo.asm && (
                      <div className="mt-6 text-center pt-2">
                        <button
                          type="button"
                          onClick={() => {
                            setActiveTab('tim');
                            handleAsmSelect(aeInfo.asm);
                          }}
                          className="text-xs sm:text-sm font-bold text-[#6f2c91] hover:text-[#582173] flex items-center justify-center gap-1.5 w-full bg-purple-50 py-3 rounded-xl transition"
                        >
                          <Icons.Users className="w-4 h-4" /> Lihat Rekap Seluruh AE di Tim {aeInfo.asm}
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'tim' && (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Pilih Nama ASM</label>
                  <select
                    value={selectedAsm}
                    onChange={(e) => handleAsmSelect(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#6f2c91] transition font-bold"
                  >
                    <option value="" disabled>-- Pilih Nama ASM --</option>
                    {asmList.map((asm, i) => (
                      <option key={i} value={asm}>{asm}</option>
                    ))}
                  </select>
                </div>

                {selectedAsm && (
                  <div className="mt-4 overflow-x-auto rounded-xl border border-slate-200 custom-scrollbar">
                    <table className="w-full text-xs sm:text-sm text-left">
                      <thead className="bg-[#6f2c91] text-[11px] text-white uppercase font-bold tracking-wider">
                        <tr>
                          <th className="px-4 py-3">Nama AE</th>
                          <th className="px-3 py-3 text-center">Total</th>
                          <th className="px-3 py-3 text-center">Cool</th>
                          <th className="px-3 py-3 text-center">Warm</th>
                          <th className="px-3 py-3 text-center">Hot</th>
                          <th className="px-3 py-3 text-center">Closing</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 bg-white">
                        {teamData.map((ae, i) => (
                          <tr key={i} className="hover:bg-slate-50 transition-colors">
                            <td className="px-4 py-3 font-bold text-slate-800 whitespace-nowrap">{ae.name}</td>
                            <td className="px-3 py-3 text-center font-black text-[#6f2c91]">{ae.total}</td>
                            <td className="px-3 py-3 text-center text-slate-600">{ae.cool}</td>
                            <td className="px-3 py-3 text-center text-amber-700 font-semibold">{ae.warm}</td>
                            <td className="px-3 py-3 text-center text-orange-700 font-semibold">{ae.hot}</td>
                            <td className="px-3 py-3 text-center text-emerald-700 font-bold">{ae.closing}</td>
                          </tr>
                        ))}
                      </tbody>
                      {teamData.length > 0 && (
                        <tfoot>
                          <tr className="bg-purple-50 font-black border-t-2 border-[#6f2c91] text-xs sm:text-sm">
                            <td className="px-4 py-3 text-purple-950 uppercase">TOTAL TIM</td>
                            <td className="px-3 py-3 text-center text-[#6f2c91]">{teamTotals.total}</td>
                            <td className="px-3 py-3 text-center text-slate-700">{teamTotals.cool}</td>
                            <td className="px-3 py-3 text-center text-amber-800">{teamTotals.warm}</td>
                            <td className="px-3 py-3 text-center text-orange-800">{teamTotals.hot}</td>
                            <td className="px-3 py-3 text-center text-emerald-800">{teamTotals.closing}</td>
                          </tr>
                        </tfoot>
                      )}
                    </table>
                  </div>
                )}
              </div>
            )}
          </div>
        </section>
      );
    }

    // ==========================================
    // MAIN APP
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('kalkulator');
      const [toast, setToast] = useState({ show: false, title: '', message: '', type: 'success' });
      const [loader, setLoader] = useState({ show: false, title: '', subtitle: '' });

      const showToast = (title, message, type = 'success') => {
        setToast({ show: true, title, message, type });
        setTimeout(() => setToast(prev => ({ ...prev, show: false })), 4000);
      };

      return (
        <div className="flex flex-col min-h-screen">
          <Toast toast={toast} onClose={() => setToast(prev => ({ ...prev, show: false }))} />
          <Loader isLoading={loader.show} title={loader.title} subtitle={loader.subtitle} />
          
          <Navbar activeTab={activeTab} onTabChange={setActiveTab} />

          <main className="flex-1 w-full max-w-6xl mx-auto p-4 sm:p-6 mt-1">
            {activeTab === 'kalkulator' ? (
              <KalkulatorView />
            ) : (
              <ReportView showToast={showToast} setLoader={setLoader} />
            )}
          </main>

          <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-8 w-full">
            <div className="max-w-2xl mx-auto px-4 space-y-1">
              <p className="font-bold text-slate-700">&copy; 2026 MyRepublic Purwokerto &bull; Sistem Sales AE</p>
              <p className="text-[11px] text-slate-400">Dioptimalkan untuk smartphone & desktop &bull; Ditenagai oleh React 18</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
